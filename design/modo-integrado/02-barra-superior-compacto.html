<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Modo integrado — compacto (referencia)</title>
  <style>
    :root { --fondo:#f7f8fa; --tarjeta:#fff; --borde:#e0e0e0; --texto:#1f2933; --sec:#5f6c7b; --titulo:#263238; --primario:#9a3412; --exito:#1b6e3c; --exito-suave:#e8f4ec; }
    * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; font-size:13px; color:var(--texto); }
    body { width:480px; height:680px; background:var(--fondo); display:flex; flex-direction:column; }
    .top { background:var(--tarjeta); border-bottom:1px solid #f6ece6; padding:8px 12px; }
    .top h1 { font-size:18px; font-weight:700; color:var(--titulo); margin-bottom:8px; }
    .row { display:flex; align-items:center; gap:8px; }
    .row .estado { flex:1; color:var(--sec); font-size:13px; }
  .estado strong { color:var(--exito); }
    .btn { border:1px solid var(--borde); background:var(--tarjeta); color:var(--primario); border-radius:6px; padding:8px 16px; font-weight:600; }
    .btn-cta { background:var(--primario); color:#fff; border-color:var(--primario); }
    main { padding:16px; flex:1; }
    .card { background:var(--tarjeta); border:1px solid var(--borde); border-radius:8px; overflow:hidden; }
    .card h2 { font-size:14px; font-weight:700; padding:12px 16px; border-bottom:1px solid var(--borde); }
    .body { padding:16px; display:flex; flex-direction:column; gap:8px; }
    .peso { border:3px solid var(--primario); border-radius:8px; min-height:120px; display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:700; }
    .btn-full { width:100%; text-align:center; padding:10px; }
    .hint { text-align:center; color:var(--sec); font-size:12px; }
    .pill { background:var(--exito-suave); color:var(--exito); font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; }
    footer { text-align:center; font-size:11px; color:var(--sec); padding:8px; border-top:1px solid var(--borde); }
  </style>
</head>
<body>
  <header class="top">
    <h1>Sistema de pesaje</h1>
    <div class="row">
      <span class="estado">Balanza <strong>OK</strong> <span class="pill">sync</span></span>
      <button type="button" class="btn">Sincronizar ahora</button>
      <button type="button" class="btn" aria-label="Menú">Menú</button>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Registro de peso</h2>
      <div class="body">
        <div class="peso">0 kg</div>
        <button type="button" class="btn btn-full">Conectar balanza</button>
        <button type="button" class="btn btn-full" disabled>Capturar peso</button>
        <p class="hint">Peso capturado: 0 kg</p>
        <button type="button" class="btn btn-full btn-cta" disabled>Enviar a la web</button>
      </div>
    </section>
  </main>
  <footer>Referencia de layout — implementación en JavaFX (pesaje.css)</footer>
</body>
</html>
