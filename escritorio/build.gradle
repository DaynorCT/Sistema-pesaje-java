import org.gradle.internal.os.OperatingSystem
import org.gradle.api.tasks.options.Option
import org.gradle.api.tasks.Internal

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.10'
    id 'bo.firmadigital.jacobitus.escritorio.java-conventions'
}

group = 'bo.firmadigital.jacobitus.escritorio'
version = '2.2.0'
mainClassName = 'bo.firmadigital.jacobitus.escritorio.Main'

def appName = 'Jacobitus Escritorio'
def appDescription = 'Aplicaci\u00f3n de escritorio para firma digital.'
def jarName = "jacobitus-escritorio"
def vendorName = 'AGETIC'
def maintainer = 'desarrollo@firmadigital.bo'
def appBaseVersion = version.toString()
def packageRelease = '1'
def buildTimestamp = System.currentTimeMillis().toString()
ext.buildAppProfile = null

String normalizeArchitecture(String rawArch) {
    if (rawArch == null) {
        throw new GradleException("La arquitectura detectada es nula.")
    }
    String archLower = rawArch.toLowerCase().trim()
    switch (archLower) {
        case 'x86_64':
        case 'amd64':
        case 'x64':
            return 'x64'
        case 'x86':
        case 'i386':
        case 'i486':
        case 'i586':
        case 'i686':
            return 'x86'
        case 'aarch64':
        case 'arm64':
            return 'arm64'
        default:
            throw new GradleException("Arquitectura no soportada o no reconocida: '${rawArch}'. Las arquitecturas permitidas son x64, x86 y arm64.")
    }
}

def normalizedArch = normalizeArchitecture(System.getProperty("os.arch"))
def is64Bits = normalizedArch == 'x64'

def getArchLinuxArch(String normArch) {
    switch(normArch) {
        case 'x64': return 'x86_64'
        case 'x86': return 'i686'
        case 'arm64': return 'aarch64'
        default: return 'x86_64'
    }
}

def appProfile = { profile ->
    def suffix = (profile ?: '').trim().toLowerCase().replaceAll(/[^a-z0-9._-]/, '-')
    if (suffix == 'prod') {
        suffix = ''
    }
    suffix
}

def artifactVersion = { profile ->
    def suffix = appProfile(profile)
    suffix ? "${appBaseVersion}-${suffix}" : appBaseVersion
}

def appRuntimeProperties = { profile ->
    [
            "-Djacobitus.version=${appBaseVersion}",
            "-Djacobitus.profile=${appProfile(profile)}",
            "-Djacobitus.compilacion=${buildTimestamp}"
    ]
}

def buildInstallerFilename = { extension ->
    def currentProfile = appProfile(project.ext.buildAppProfile)
    def profilePart = currentProfile ? "-${currentProfile}" : ""
    def ext = extension.startsWith('.') ? extension : ".${extension}"
    return "${jarName}-${appBaseVersion}${profilePart}-${normalizedArch}${ext}"
}

def printTaskHeader = { taskName, profile ->
    def dispProfile = appProfile(profile)
    if (dispProfile == '') dispProfile = 'prod'

    println "=================================================="
    println "                  GENERANDO INSTALADOR            "
    println "=================================================="
    println "Aplicación   : ${appName}"
    println "Sistema      : ${System.getProperty('os.name')}"
    println "Arquitectura : ${normalizedArch}"
    println "Versión      : ${appBaseVersion}"
    println "Perfil       : ${dispProfile}"
    println "=================================================="
}

def printTaskSuccess = { filename, File targetDir ->
    println ""
    println "Instalador generado: ${filename}"
    println "Ubicación: ${new File(targetDir, filename).absolutePath}"
}

class BuildAppTask extends DefaultTask {
    @Internal String profile
    @Option(option = 'app-profile', description = 'Perfil de distribucion del instalador. Ej: prod, dev, test, demo')

    void setProfile(String profile) {
        this.profile = profile
        project.ext.buildAppProfile = profile
    }
}

class PackageAppTask extends Exec {
    @Internal String profile
    @Option(option = 'app-profile', description = 'Perfil de distribucion del instalador. Ej: prod, dev, test, demo')
    
    void setProfile(String profile) {
        this.profile = profile
        project.ext.buildAppProfile = profile
    }
}

class PackageRpmTask extends DefaultTask {
    @Internal String profile
    @Option(option = 'app-profile', description = 'Perfil de distribucion del instalador. Ej: prod, dev, test, demo')

    void setProfile(String profile) {
        this.profile = profile
        project.ext.buildAppProfile = profile
    }
}

class PackageArchTask extends DefaultTask {
    @Internal String profile
    @Option(option = 'app-profile', description = 'Perfil de distribucion del instalador. Ej: prod, dev, test, demo')

    void setProfile(String profile) {
        this.profile = profile
        project.ext.buildAppProfile = profile
    }
}

def distSnapshot = {
    def distDir = file("${projectDir}/dist")
    distDir.exists() ? distDir.listFiles().collect { it.name } as Set : [] as Set
}

def renameProfileArtifacts = { before, buildStartedAt, extension ->
    def distDir = file("${projectDir}/dist")
    if (!distDir.exists()) {
        return
    }

    def targetFilename = buildInstallerFilename(extension)

    distDir.listFiles()
            .findAll { (!before.contains(it.name) || it.lastModified() >= buildStartedAt) && (it.name.contains(appBaseVersion) || it.name.contains(jarName)) }
            .each { artifact ->
                def renamedArtifact = file("${artifact.parent}/${targetFilename}")
                delete renamedArtifact
                if (!artifact.renameTo(renamedArtifact)) {
                    throw new GradleException("No se pudo renombrar ${artifact.name} a ${targetFilename}")
                }
                printTaskSuccess(targetFilename, distDir)
            }
}

def os = OperatingSystem.current()

repositories {
    mavenLocal()
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':jacobitus-libreria')
    implementation 'com.dorkbox:SystemTray:4.4'

    implementation 'org.openjfx:javafx-controls:15.0.1'
    implementation 'org.openjfx:javafx-fxml:15.0.1'
    implementation 'org.openjfx:javafx-swing:15.0.1'

    implementation 'org.eclipse.jetty:jetty-server:10.0.21'
    implementation 'org.eclipse.jetty:jetty-servlet:10.0.21'
    implementation 'org.eclipse.jetty:jetty-servlets:10.0.21'
    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-servlet:2.43'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:2.43'

    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.1.2'
    implementation 'org.codehaus.jettison:jettison:1.5.1'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'org.apache.santuario:xmlsec:2.3.1'

    implementation 'com.digitalpersona.onetouch:dpotapi:1.0'
    implementation 'com.digitalpersona.onetouch:dpotjni:1.0'
    implementation 'fr.opensagres.xdocreport:org.odftoolkit.odfdom.converter.pdf:1.0.6'
    implementation 'fr.opensagres.xdocreport:org.apache.poi.xwpf.converter.pdf:1.0.6'

    implementation 'com.vdurmont:semver4j:3.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

javafx {
    version = '15.0.1'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.swing', 'javafx.base']
}

jar {
    archiveBaseName = jarName
    archiveVersion = version
    manifest {
        attributes(
            'Main-Class': mainClassName,
            'Class-Path': configurations.runtimeClasspath.files.collect { file ->
                if (file.name.contains("jacobitus-libreria")) {
                    return file.name
                }
                return "dependencias/${file.name}"
            }.join(' ')
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += '-Dfile.encoding=UTF-8'
}

def generatedResourcesDir = layout.buildDirectory.dir('generated/resources/main')

tasks.register('generateAppInfo') {
    inputs.property 'appDescription', appDescription
    outputs.dir generatedResourcesDir
    doLast {
        def outputDir = generatedResourcesDir.get().asFile
        outputDir.mkdirs()
        def propertiesFile = new File(outputDir, 'jacobitus.properties')
        propertiesFile.setText("descripcion=${appDescription}\n", 'UTF-8')
    }
}

sourceSets {
    main {
        resources.srcDir generatedResourcesDir
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateAppInfo')
}

tasks.named('run', JavaExec) {
    doFirst {
        def runProfile = project.findProperty('profile') ?: 'dev'
        setJvmArgs((getJvmArgs() ?: [])
                .findAll { arg ->
                            !arg.startsWith('-Djacobitus.version=') &&
                            !arg.startsWith('-Djacobitus.profile=') &&
                            !arg.startsWith('-Djacobitus.compilacion=')
                }
                + appRuntimeProperties(runProfile))
    }
}

tasks.register('importCA', Copy) {
    from 'ca'
    into 'build/libs/ca'
}

tasks.register('addDrivers', Copy) {
    group = 'build'

    def driversDir

    if (os.isLinux()) {
        driversDir = layout.projectDirectory.dir('controladores/linux')
    } else if (os.isMacOsX()) {
        driversDir = layout.projectDirectory.dir('controladores/macos')
    } else if (os.isWindows()) {
        driversDir = layout.projectDirectory.dir('controladores/windows')
    } else {
        throw new GradleException("Sistema operativo no soportado")
    }

    from driversDir
    into layout.buildDirectory.dir('libs/controladores')
}

tasks.register('importChangePin', Copy) {
    group = 'build'

    if (os.isLinux()) {
        from project(':jacobitus-libreria').file('build/libs/libchangepin.so')
    } else if (os.isMacOsX()) {
        from project(':jacobitus-libreria').file('build/libs/libchangepin.dylib')
    } else if (os.isWindows()) {
        from project(':jacobitus-libreria').file('build/libs/changepin.dll')
    }

    into 'build/libs'
}

def jpackageCmd = [
    "${System.getProperty("java.home")}/bin/jpackage",
    '--verbose',
    '--input', 'build/libs',
    '--main-class', mainClassName,
    '--main-jar', "${jarName}-${appBaseVersion}.jar",
    '--vendor', vendorName,
    '--dest', 'dist',
    '--name', appName,
    '--app-version', appBaseVersion,
    '--description', appDescription,
    '--file-associations', 'FAjws.properties',
    '--file-associations', 'FAp7s.properties',
    '--file-associations', 'FApdf.properties',
    '--java-options', '-Dfile.encoding=UTF-8',
    '--java-options', "-Djacobitus.version=${appBaseVersion}",
    '--java-options', '-Djacobitus.profile=',
    '--java-options', "-Djacobitus.compilacion=${buildTimestamp}",
    '--license-file', os.isWindows() ? 'license.rtf' : 'license.txt'
]

tasks.register('copyAllDependencies') {
    group = 'build'

    dependsOn configurations.runtimeClasspath
    dependsOn ':jacobitus-libreria:build'

    doLast {
        copy {
            from configurations.runtimeClasspath
            from project(':jacobitus-libreria').file("build/dependencies")
            into layout.buildDirectory.dir('libs/dependencias')
            
            exclude { element -> element.file.name.contains("jacobitus-libreria") }
            exclude '*.so', '*.dylib', '*.dll'
            
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }

        copy {
            from project(':jacobitus-libreria').layout.buildDirectory.dir('libs')
            into layout.buildDirectory.dir('libs')
            include '*.jar'
            exclude '*.so', '*.dylib', '*.dll'
            
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

tasks.register('packageApp', PackageAppTask) {
    group = 'distribution'

    dependsOn clean
    dependsOn ':jacobitus-libreria:buildNative'
    dependsOn jar
    dependsOn copyAllDependencies
    dependsOn importCA
    dependsOn addDrivers
    dependsOn importChangePin

    def osArgs = []
    def extension = 'bin'

    if (os.isLinux()) {
        extension = 'deb'
        osArgs = [
            '--type', 'deb',
            '--icon', 'iconos/icon.png',
            '--resource-dir', 'plantillas/deb',
            '--linux-package-name', jarName,
            '--linux-deb-maintainer', maintainer,
            '--linux-package-deps', 'libnss3-tools, pcscd, pcsc-tools, libnss3, libpcsclite1',
            '--linux-shortcut'
        ]
    } else if (os.isMacOsX()) {
        extension = 'pkg'
        osArgs = [
            '--type', 'pkg',
            '--icon', 'iconos/icon.icns'
        ]
    } else if (os.isWindows()) {
        extension = 'msi'
        if (is64Bits) {
            println "Generando instalador Windows MSI 64 bits"
            osArgs = [
                '--type', 'msi',
                '--icon', 'iconos/icon.ico',
                '--resource-dir', 'plantillas/windows',
                '--win-shortcut',
                '--win-menu',
                '--win-menu-group', 'AGETIC',
                '--win-upgrade-uuid', "47fdae43-82ca-40ca-887f-8e6459366643"
            ]
        } else {
            println "Generando instalador Windows MSI 32 bits"
            osArgs = [
                '--type', 'msi',
                '--icon', 'iconos/icon.ico',
                '--resource-dir', 'plantillas/windows',
                '--win-shortcut',
                '--win-menu',
                '--win-menu-group', 'AGETIC',
                '--win-upgrade-uuid', "47fdae43-82ca-40ca-887f-8e6459366643"
            ]
        }
    } else {
        throw new GradleException("Sistema operativo no soportado")
    }

    project(':jacobitus-libreria').tasks.findByName('buildNative').mustRunAfter 'clean'
    tasks.findByName('jar').mustRunAfter ':jacobitus-libreria:buildNative'
    tasks.findByName('copyAllDependencies').mustRunAfter 'jar'
    tasks.findByName('importCA').mustRunAfter('clean')
    tasks.findByName('addDrivers').mustRunAfter('clean', ':jacobitus-libreria:buildNative')
    tasks.findByName('importChangePin').mustRunAfter('clean', ':jacobitus-libreria:buildNative')

    def distBefore = [] as Set
    def distBuildStartedAt = 0L

    doFirst {
        printTaskHeader('packageApp', project.ext.buildAppProfile)
        def profile = appProfile(project.ext.buildAppProfile)
        distBefore = distSnapshot()
        distBuildStartedAt = System.currentTimeMillis() - 2000
        commandLine(jpackageCmd.collect {
            it == '-Djacobitus.profile=' ? "-Djacobitus.profile=${profile}" : it
        } + osArgs)
    }

    doLast {
        renameProfileArtifacts(distBefore, distBuildStartedAt, extension)
    }
}

tasks.register('buildApp', BuildAppTask) {
    group = 'distribution'
    dependsOn packageApp
    doLast {}
}

tasks.register('packageRpm', PackageRpmTask) {
    group = 'distribution'

    def appCategory = 'Utility;'
    def mimeTypes = 'application/jose;application/pkcs7-signature;application/pdf'

    def rpmRoot = file("${buildDir}/rpm")
    def tempAppImageDir = file("${buildDir}/tmp/app-image")
    def appImageDir = file("${tempAppImageDir}/${appName}")
    def specTemplate = file("${projectDir}/plantillas/rpm/${jarName}.spec")
    def desktopTemplate = file("${projectDir}/plantillas/rpm/resources/${jarName}-${appName.replace(' ', '')}.desktop")

    dependsOn clean
    dependsOn ':jacobitus-libreria:buildNative'
    dependsOn jar
    dependsOn copyAllDependencies
    dependsOn importCA
    dependsOn addDrivers
    dependsOn importChangePin

    project(':jacobitus-libreria').tasks.findByName('buildNative').mustRunAfter 'clean'
    tasks.findByName('jar').mustRunAfter ':jacobitus-libreria:buildNative'
    tasks.findByName('copyAllDependencies').mustRunAfter 'jar'
    tasks.findByName('importCA').mustRunAfter('clean')
    tasks.findByName('addDrivers').mustRunAfter('clean', ':jacobitus-libreria:buildNative')
    tasks.findByName('importChangePin').mustRunAfter('clean', ':jacobitus-libreria:buildNative')

    doFirst {
        printTaskHeader('packageRpm', project.ext.buildAppProfile)
        if (tempAppImageDir.exists()) {
            logger.lifecycle("Eliminando app-image previo...")
            delete tempAppImageDir
        }

        tempAppImageDir.mkdirs()
        delete rpmRoot

        ['BUILD', 'RPMS', 'SOURCES', 'SPECS', 'SRPMS'].each {
            file("${rpmRoot}/${it}").mkdirs()
        }
    }

    doLast {
        exec {
            workingDir './'
            commandLine([
                    "${System.getProperty("java.home")}/bin/jpackage",
                    '--verbose',
                    '--input', 'build/libs',
                    '--main-class', mainClassName,
                    '--main-jar', "${jarName}-${appBaseVersion}.jar",
                    '--vendor', vendorName,
                    '--dest', tempAppImageDir.absolutePath,
                    '--name', appName,
                    '--app-version', appBaseVersion,
                    '--description', appDescription,
                    '--java-options', '-Dfile.encoding=UTF-8',
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[0],
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[1],
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[2],
                    '--type', 'app-image',
                    '--icon', './iconos/icon.png',
            ])
        }

        appImageDir = tempAppImageDir.listFiles()?.find {
            it.isDirectory()
        }

        if (appImageDir == null || !appImageDir.exists()) {
            throw new GradleException("No se encontró el app-image en ${tempAppImageDir}")
        }

        def sourceDir = file("${rpmRoot}/SOURCES/opt/${jarName}")

        copy {
            from appImageDir
            into sourceDir
        }

        copy {
            from(appImageDir) {
                include '**/*.png'
                eachFile { file ->
                    if (file.name.contains(' ')) {
                        file.name = file.name.replaceAll(/\s+/, '_')
                    }
                }
                includeEmptyDirs = false
            }
            into sourceDir
        }

        def desktopFile = file("${sourceDir}/lib/${jarName}-${appName.replace(' ', '')}.desktop")

        def desktopContent = desktopTemplate.text
                .replace('@APP_NAME@', appName)
                .replace('@DESCRIPTION@', appDescription)
                .replace('@INSTALL_DIR@', "/opt/${jarName}")
                .replace('@EXECUTABLE_NAME@', appName)
                .replace('@ICON_NAME@', "${appName.replace(' ', '_')}.png")
                .replace('@CATEGORY@', appCategory)
                .replace('@MIME_TYPES@', mimeTypes)

        desktopFile.text = desktopContent

        logger.lifecycle("Desktop file generado: ${desktopFile.absolutePath}")

        copy {
            from ("${projectDir}/plantillas/rpm/resources") {
                exclude '*.desktop'
            }
            into "${sourceDir}/lib"
        }

        def specFile = file("${rpmRoot}/SPECS/${jarName}.spec")

        def specContent = specTemplate.text
                .replace('@SUMMARY@', appName)
                .replace('@NAME@', jarName)
                .replace('@VERSION@', appBaseVersion)
                .replace('@RELEASE@', packageRelease)
                .replace('@LICENSE@', 'LPG-Bolivia')
                .replace('@VENDOR@', vendorName)
                .replace('@PREFIX@', '/opt')
                .replace('@PROVIDES@', jarName)
                .replace('@GROUP@', 'Utility')
                .replace('@REQUIRES@', ', nss-tools, pcsc-lite, pcsc-lite-ccid, pcsc-tools, nss, pcsc-lite-libs')
                .replace('@DESCRIPTION@', appDescription)
                .replace('@SOURCE_DIR@', "/opt/${jarName}")
                .replace('@INSTALL_DIR@', "/opt/${jarName}")
                .replace('@LICENSE_FILE@', "${projectDir}/license.txt")
                .replace('@DESKTOP_FILE@', "/opt/${jarName}/lib/${jarName}-${appName.replace(' ', '')}.desktop")
                .replace('@MIME_FILE@', "/opt/${jarName}/lib/${jarName}-${appName.replace(' ', '')}-MimeInfo.xml")
                .replace('@UNINSTALL_MIME@', "${jarName}-${appName.replace(' ', '')}.desktop application/jose application/pkcs7-signature application/pdf")

        specFile.text = specContent

        logger.lifecycle("SPEC generado: ${specFile.absolutePath}")

        exec {
            environment 'HOME', rpmRoot.absolutePath
            commandLine('rpmbuild', '--define', "_topdir ${rpmRoot.absolutePath}", '-bb', specFile.absolutePath)
        }

        def rpmFiles = fileTree("${rpmRoot}/RPMS").matching {
            include '**/*.rpm'
        }.files

        if (rpmFiles.empty) {
            throw new GradleException("No se generó el RPM")
        }

        def rpmOutput = rpmFiles.first()
        def targetFilename = buildInstallerFilename('rpm')

        copy {
            from rpmOutput
            into "${projectDir}/dist"
            rename { targetFilename }
        }

        def distDir = file("${projectDir}/dist")
        printTaskSuccess(targetFilename, distDir)
    }
}

tasks.register('packageArch', PackageArchTask) {
    group = 'distribution'

    def appCategory = 'Utility'
    def mimeTypes = 'application/jose;application/pkcs7-signature;application/pdf'

    def archRoot = file("${buildDir}/arch")
    def tempAppImageDir = file("${buildDir}/tmp/app-image")

    dependsOn clean
    dependsOn ':jacobitus-libreria:buildNative'
    dependsOn jar
    dependsOn copyAllDependencies
    dependsOn importCA
    dependsOn addDrivers
    dependsOn importChangePin

    project(':jacobitus-libreria').tasks.findByName('buildNative').mustRunAfter 'clean'
    tasks.findByName('jar').mustRunAfter ':jacobitus-libreria:buildNative'
    tasks.findByName('copyAllDependencies').mustRunAfter 'jar'
    tasks.findByName('importCA').mustRunAfter('clean')
    tasks.findByName('addDrivers').mustRunAfter('clean', ':jacobitus-libreria:buildNative')
    tasks.findByName('importChangePin').mustRunAfter('clean', ':jacobitus-libreria:buildNative')

    doFirst {
        printTaskHeader('packageArch', project.ext.buildAppProfile)
        if (tempAppImageDir.exists()) {
            logger.lifecycle("Eliminando app-image previo...")
            delete tempAppImageDir
        }
        delete archRoot

        tempAppImageDir.mkdirs()
        archRoot.mkdirs()
    }

    doLast {
        exec {
            workingDir './'
            commandLine([
                    "${System.getProperty("java.home")}/bin/jpackage",
                    '--verbose',
                    '--input', 'build/libs',
                    '--main-class', mainClassName,
                    '--main-jar', "${jarName}-${appBaseVersion}.jar",
                    '--vendor', vendorName,
                    '--dest', tempAppImageDir.absolutePath,
                    '--name', appName,
                    '--app-version', appBaseVersion,
                    '--description', appDescription,
                    '--java-options', '-Dfile.encoding=UTF-8',
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[0],
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[1],
                    '--java-options', appRuntimeProperties(project.ext.buildAppProfile)[2],
                    '--type', 'app-image',
                    '--icon', './iconos/icon.png',
            ])
        }

        def appImageDir = tempAppImageDir.listFiles()?.find { it.isDirectory() }

        if (appImageDir == null || !appImageDir.exists()) {
            throw new GradleException("No se encontró el app-image generado por jpackage")
        }

        def packageDir = file("${archRoot}/${jarName}")

        copy {
            from appImageDir
            into "${packageDir}/opt/${jarName}"
        }

        copy {
            from(appImageDir) {
                include '**/*.png'
                eachFile { file ->
                    if (file.name.contains(' ')) {
                        file.name = file.name.replaceAll(/\s+/, '_')
                    }
                }
                includeEmptyDirs = false
            }
            into "${packageDir}/opt/${jarName}"
        }

        copy {
            from("${projectDir}/plantillas/arch/resources") {
                exclude '*.desktop'
            }
            into "${packageDir}/opt/${jarName}/lib"
        }

        def installTemplate = file("${projectDir}/plantillas/arch/resources/${jarName}.install")
        def installFile = file("${archRoot}/${jarName.toLowerCase()}.install")

        if (installTemplate.exists()) {
            def installContent = installTemplate.text
                    .replace('@APP_NAME@', appName)
            
            installFile.text = installContent
            logger.lifecycle(".install file generado: ${installFile.absolutePath}")
        } else {
            throw new GradleException("No se encontró la plantilla app.install en ${installTemplate.absolutePath}")
        }

        def desktopTemplate = file("${projectDir}/plantillas/arch/resources/${jarName}-${appName.replace(' ', '')}.desktop")
        def desktopFile = file("${packageDir}/opt/${jarName}/lib/${jarName}-${appName.replace(' ', '')}.desktop")

        if (desktopTemplate.exists()) {
            def desktopContent = desktopTemplate.text
                    .replace('@APP_NAME@', appName)
                    .replace('@DESCRIPTION@', appDescription)
                    .replace('@INSTALL_DIR@', "/opt/${jarName}")
                    .replace('@EXECUTABLE_NAME@', appName)
                    .replace('@ICON_NAME@', "${appName.replace(' ', '_')}.png")
                    .replace('@CATEGORY@', appCategory)
                    .replace('@MIME_TYPES@', mimeTypes)
            desktopFile.text = desktopContent
            logger.lifecycle("Desktop file generado: ${desktopFile.absolutePath}")
        }

        def mimeSource = file("${projectDir}/plantillas/arch/${jarName}.xml")
        if (mimeSource.exists()) {
            copy {
                from mimeSource
                into archRoot
            }
        } else {
            file("${archRoot}/${jarName}.xml").text = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<mime-info xmlns=\"http://www.freedesktop.org/standards/shared-mime-info\"></mime-info>"
        }

        def pkgbuildTemplate = file("${projectDir}/plantillas/arch/PKGBUILD")
        def pkgbuildFile = file("${archRoot}/PKGBUILD")
        def ARCH_DEPENDS = "'nss' 'pcsclite' 'ccid' 'pcsc-tools'"
        def ARCH_OPTDEPENDS = ""        
        
        def archLinuxArchitecture = getArchLinuxArch(normalizedArch)

        def pkgbuildContent = pkgbuildTemplate.text
                .replace('@PKGNAME@', jarName.toLowerCase())
                .replace('@PKGVER@', appBaseVersion)
                .replace('@PKGREL@', packageRelease)
                .replace('@PKGDESC@', appDescription)
                .replace('@ARCH@', archLinuxArchitecture)
                .replace('@URL@', 'https://firmadigital.bo/herramientas/jacobitus-escritorio')
                .replace('@LICENSE@', 'LPG-Bolivia')
                .replace("@REQUIRES@", ARCH_DEPENDS)
                .replace("@OPTREQUIRES@", ARCH_OPTDEPENDS)
                .replace('@VENDOR@', vendorName)
                .replace('@APP_NAME@', appName.replace(' ', ''))
                .replace('@JAR_NAME@', jarName)

        pkgbuildFile.text = pkgbuildContent
        logger.lifecycle("PKGBUILD generado: ${pkgbuildFile.absolutePath}")

        exec {
            workingDir archRoot
            commandLine 'makepkg', '-f', '--nodeps', '--noextract'
        }

        def pkgFiles = fileTree(archRoot).matching {
            include "${jarName}-*.pkg.tar.zst"
            exclude '*-debug-*.pkg.tar.zst'
        }.files

        if (pkgFiles.empty) {
            throw new GradleException("No se generó el paquete ArchLinux (.pkg.tar.zst)")
        }

        def pkgOutput = pkgFiles.first()
        def targetFilename = buildInstallerFilename('pkg.tar.zst')

        copy {
            from pkgOutput
            into "${projectDir}/dist"
            rename { targetFilename }
        }

        def distDir = file("${projectDir}/dist")
        printTaskSuccess(targetFilename, distDir)
    }
}